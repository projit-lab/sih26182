version: '3.8'

services:
  sih-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih26182-backend
    ports:
      - "8000:8000"
    environment:
      - USE_LIVE_API=false
      - DEFAULT_HOP_DEPTH=3
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
